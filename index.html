<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine?</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#ffd6e8,#ffeaf4);
display:flex;
justify-content:center;
align-items:center;
font-family:Poppins,sans-serif
}
.card{
background:#fff;
padding:30px 40px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.15);
width:320px;
position:relative
}
.emoji{font-size:60px;margin-bottom:10px}
h1{font-size:20px;margin-bottom:25px}
.buttons{position:relative;height:60px}
button{
border:none;
padding:12px 25px;
border-radius:30px;
font-size:16px;
cursor:pointer;
position:absolute;
transition:.3s
}
#yesBtn{background:#ff4d6d;color:#fff;left:50%;transform:translateX(-50%)}
#noBtn{background:#eee;color:#555;right:10px}
.celebrate{display:none;margin-top:20px}
.celebrate img{width:100%;border-radius:15px}
</style>
</head>
<body>

<div class="card">
<div class="emoji">🐥💗</div>
<h1>rishi will you be my valentine?</h1>

<div class="buttons">
<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>
</div>

<div class="celebrate" id="celebrate">
<h2>YAYYY 🎉💃</h2>
<img src="https://media.giphy.com/media/l0MYB8Ory7Hqefo9a/giphy.gif">
</div>
</div>

<script>
const noBtn=document.getElementById("noBtn")
const yesBtn=document.getElementById("yesBtn")
const celebrate=document.getElementById("celebrate")

noBtn.addEventListener("mouseover",()=>{
const x=Math.random()*200-100
const y=Math.random()*100-50
noBtn.style.transform=`translate(${x}px,${y}px)`
})

yesBtn.addEventListener("click",()=>{
celebrate.style.display="block"
yesBtn.style.display="none"
noBtn.style.display="none"
})
</script>

</body>
</html>
